html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	/* iOS: stop long-press callout/magnifier, text selection and the gray tap flash. */
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	touch-action: none;
	-webkit-touch-callout: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas:focus {
	outline: none;
}

/* ---- Custom boot overlay ---- */
#boot {
	position: fixed;
	inset: 0;
	background: #000;
	overflow: hidden;
	z-index: 10;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	cursor: pointer;
	/* mask is animated during the iris reveal */
	-webkit-mask-image: none;
	mask-image: none;
}

#boot.fade-text #boot-text {
	transition: opacity 0.4s ease, transform 0.4s ease;
}

#fx {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	display: block;
}

#boot-text {
	position: relative;
	z-index: 2;
	font-family: 'Eclipse Foundry', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	font-weight: 600;
	letter-spacing: 0.18em;
	font-size: clamp(2rem, 9vw, 5rem);
	color: #29f6ff;
	text-shadow:
		0 0 8px rgba(41, 246, 255, 0.9),
		0 0 22px rgba(41, 246, 255, 0.6),
		0 0 48px rgba(41, 246, 255, 0.35);
	text-align: center;
	user-select: none;
	-webkit-user-select: none;
	pointer-events: none;
}

#boot-cursor {
	color: #29f6ff;
	font-weight: 600;
	margin-left: 0.04em;
	animation: boot-blink 1.05s steps(1) infinite;
}

@keyframes boot-blink {
	0%, 49% { opacity: 1; }
	50%, 100% { opacity: 0; }
}

#boot-sub {
	position: relative;
	z-index: 2;
	margin-top: 1.1em;
	font-family: 'Eclipse Foundry', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
	font-weight: 400;
	letter-spacing: 0.32em;
	text-transform: uppercase;
	font-size: clamp(1.75rem, 6vw, 2.5rem);
	color: rgba(41, 246, 255, 0.0);
	text-shadow: 0 0 12px rgba(41, 246, 255, 0.5);
	user-select: none;
	-webkit-user-select: none;
	pointer-events: none;
	transition: color 0.5s ease;

// First-party analytics: one tiny sender shared by the boot shell (below) and
// the game (via JavaScriptBridge -> window.__analytics.track). Fire-and-forget
// beacons to /api/event; analytics must never break or delay the boot.
window.__analytics = (function () {
	function newId() {
		return (window.crypto && crypto.randomUUID)
			? crypto.randomUUID()
			: String(Date.now()) + '-' + Math.random().toString(16).slice(2);
	}
	const sid = newId();
	// Persistent visitor id so return visits are recognizable. localStorage can
	// throw (private mode, blocked storage) — then vid stays '' and the visit
	// is simply counted as new.
	let vid = '';
	try {
		vid = localStorage.getItem('deeb_vid') || '';
		if (!vid) {
			vid = newId();
			localStorage.setItem('deeb_vid', vid);
		}
	} catch (err) { /* ignore */ }
	const t0 = performance.now();
	let src = '';
	try { src = new URLSearchParams(location.search).get('src') || ''; } catch (err) { /* ignore */ }

	function track(name, props) {
		try {
			const body = JSON.stringify({ sid: sid, vid: vid, n: name, p: props || {}, src: src, ref: document.referrer || '' });
			if (navigator.sendBeacon) {
				navigator.sendBeacon('/api/event', body);
			} else {
				fetch('/api/event', { method: 'POST', body: body, keepalive: true }).catch(function () {});
			}
		} catch (err) { /* never break the boot */ }
	}

	// Session duration: ping on hide/pagehide (the combo that works on iOS
	// Safari), throttled so a flurry of tab switches doesn't spam rows.
	// Queries take MAX(t) per session.
	let lastPing = -10;
	function ping() {
		const t = Math.round((performance.now() - t0) / 1000);
		if (t - lastPing >= 5) {
			lastPing = t;
			track('session_ping', { t: t });
		}
	}
	window.addEventListener('pagehide', ping);
	document.addEventListener('visibilitychange', function () {
		if (document.visibilityState === 'hidden') { ping(); }
	});

	track('page_load', { w: window.innerWidth, h: window.innerHeight, dpr: window.devicePixelRatio || 1 });
	return { track: track, t0: t0 };

		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const HOLD_MS = 900;

	const boot = document.getElementById('boot');
	const bootText = document.getElementById('boot-text');
	const bootNotice = document.getElementById('boot-notice');
	const ring = document.getElementById('hold-ring');
	const ringProgress = document.getElementById('hold-progress');

	// Typewriter intro for the wordmark (cursor blinks via CSS).
	(function typeWordmark() {
		const typed = document.getElementById('boot-typed');
		const word = 'deeb devs';
		const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		if (reduced) { typed.textContent = word; return; }
		let i = 1;
		(function step() {
			typed.textContent = word.slice(0, i);
			if (i < word.length) {
				i++;
				window.setTimeout(step, 95 + Math.random() * 70);
			}
		})();
	}());

	let phase = 'loading'; // loading -> ready -> revealing -> done
	let loadProgress = 0;   // 0..1, drives particle intensity

	// ---- Ring geometry ----
	const RING_R = 56;
	const RING_CIRC = 2 * Math.PI * RING_R;
	ringProgress.style.strokeDasharray = RING_CIRC.toFixed(2);
	ringProgress.style.strokeDashoffset = RING_CIRC.toFixed(2);

	// =====================================================================
	// WebGL particle swarm (stateless flow-field "boids")
	// =====================================================================
	const fx = document.getElementById('fx');
	let swarm = null;
	try {
		swarm = createSwarm(fx);
	} catch (err) {
		console.warn('Swarm disabled:', err);
		window.__analytics.track('boot_error', { msg: 'swarm_disabled', fatal: false });
	}

	function createSwarm(canvas) {
		const gl = canvas.getContext('webgl', { alpha: false, antialias: false, premultipliedAlpha: false })
			|| canvas.getContext('experimental-webgl');
		if (!gl) {
			throw new Error('WebGL unavailable');
		}

		const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
		const dpr = Math.min(window.devicePixelRatio || 1, 2);

		const VERT = [
			'attribute vec2 a_seed;',
			'uniform float u_time;',
			'uniform float u_dpr;',
			'varying float v_alpha;',
			'varying float v_depth;',
			'float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }',
			'void main(){',
			'  float t = u_time;',
			'  vec2 base = a_seed * 2.0 - 1.0;',
			'  float z = hash(a_seed + 7.3);',
			'  float spd = 0.15 + 0.30 * hash(a_seed + 2.1);',
			'  float tt = t * spd;',
			'  float fx1 = sin(base.y * 3.0 + tt) + 0.5 * cos(base.x * 5.0 - tt * 1.3);',
			'  float fy1 = cos(base.x * 3.0 - tt * 0.9) + 0.5 * sin(base.y * 5.0 + tt * 1.1);',
			'  vec2 pos = base + 0.32 * vec2(fx1, fy1) * (0.4 + 0.6 * z);',
			'  float ang = tt * 0.05;',
			'  float ca = cos(ang); float sa = sin(ang);',
			'  pos = mat2(ca, -sa, sa, ca) * pos;',
			'  gl_Position = vec4(pos, 0.0, 1.0);',
			'  gl_PointSize = u_dpr * mix(1.0, 3.6, z);',
			'  v_alpha = mix(0.12, 0.85, z);',
			'  v_depth = z;',
			'}'
		].join('\n');

		const FRAG = [
			'precision mediump float;',
			'varying float v_alpha;',
			'varying float v_depth;',
			'uniform float u_intensity;',
			'void main(){',
			'  vec2 c = gl_PointCoord - 0.5;',
			'  float d = length(c);',
			'  if (d > 0.5) discard;',
			'  float soft = smoothstep(0.5, 0.0, d);',
			'  vec3 col = mix(vec3(0.85, 0.0, 0.6), vec3(1.0, 0.25, 0.95), v_depth);',
			'  gl_FragColor = vec4(col, soft * v_alpha * u_intensity);',
			'}'

			const s = gl.createShader(type);
			gl.shaderSource(s, src);
			gl.compileShader(s);
			if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {

			}
			return s;
		}

		gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
		gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
		gl.linkProgram(prog);
		if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
			throw new Error('Link: ' + gl.getProgramInfoLog(prog));
		}
		gl.useProgram(prog);

		// Particle count scales with screen area; capped for weak devices.
		const area = window.innerWidth * window.innerHeight;
		let count = Math.round(area * 0.05);
		count = Math.max(6000, Math.min(count, 36000));
		if (reduced) {
			count = Math.min(count, 4000);
		}

		const seeds = new Float32Array(count * 2);
		for (let i = 0; i < seeds.length; i++) {
			seeds[i] = Math.random();
		}
		const buf = gl.createBuffer();
		gl.bindBuffer(gl.ARRAY_BUFFER, buf);
		gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
		const aSeed = gl.getAttribLocation(prog, 'a_seed');
		gl.enableVertexAttribArray(aSeed);
		gl.vertexAttribPointer(aSeed, 2, gl.FLOAT, false, 0, 0);

		const uTime = gl.getUniformLocation(prog, 'u_time');
		const uDpr = gl.getUniformLocation(prog, 'u_dpr');
		const uIntensity = gl.getUniformLocation(prog, 'u_intensity');

		gl.disable(gl.DEPTH_TEST);
		gl.enable(gl.BLEND);
		gl.blendFunc(gl.ONE, gl.ONE); // additive glow

		function resize() {
			const w = Math.floor(window.innerWidth * dpr);
			const h = Math.floor(window.innerHeight * dpr);
			if (canvas.width !== w || canvas.height !== h) {
				canvas.width = w;
				canvas.height = h;
				gl.viewport(0, 0, w, h);
			}
		}
		window.addEventListener('resize', resize);
		resize();

		gl.uniform1f(uDpr, dpr);

		let raf = 0;
		let lost = false;
		canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); lost = true; });

		const timeScale = reduced ? 0.4 : 1.0;
		let intensity = 0.0;

		function frame(now) {
			if (lost) { return; }
			// Ease intensity up as the project loads, with a gentle floor.
			const target = 0.45 + 0.55 * loadProgress;
			intensity += (target - intensity) * 0.05;
			gl.clearColor(0, 0, 0, 1);
			gl.clear(gl.COLOR_BUFFER_BIT);

		}

			stop: function () {

				if (raf) { window.cancelAnimationFrame(raf); }

	// =====================================================================
	// Phase: ready -> hold -> reveal
	// =====================================================================
	let holdRaf = 0;
	let holdStart = 0;
	let holdX = 0;
	let holdY = 0;
	let holding = false;
	let readyAt = 0;

	function enterReady() {
		if (phase !== 'loading') { return; }
		phase = 'ready';
		boot.classList.add('ready');
		boot.addEventListener('pointerdown', onPointerDown);
		readyAt = performance.now();
		window.__analytics.track('boot_ready', { load_ms: Math.round(readyAt - window.__analytics.t0) });
	}

	function setRingPos(x, y) {
		ring.style.transform = 'translate(' + x + 'px, ' + y + 'px)';
	}

	}

		if (!holdStart) { holdStart = now; }
		const frac = Math.min((now - holdStart) / HOLD_MS, 1);
		ringProgress.style.strokeDashoffset = (RING_CIRC * (1 - frac)).toFixed(2);
		if (frac >= 1) {

		}
		holdRaf = window.requestAnimationFrame(holdTick);
	}

		if (phase !== 'ready') { return; }
		holding = false;
		if (holdRaf) { window.cancelAnimationFrame(holdRaf); }

		ringProgress.style.strokeDashoffset = RING_CIRC.toFixed(2);
		window.removeEventListener('pointerup', onPointerUp);
		window.removeEventListener('pointercancel', onPointerUp);
	}

	function beginReveal(x, y) {
		if (phase !== 'ready') { return; }
		phase = 'revealing';
		holding = false;
		window.removeEventListener('pointerup', onPointerUp);
		window.removeEventListener('pointercancel', onPointerUp);
		boot.removeEventListener('pointerdown', onPointerDown);

		// so the in-game intro can place its colour spotlight at the same spot.

		window.__deebEnterY = y / window.innerHeight;
		window.__deebStarted = true;
		window.__analytics.track('enter_completed', { wait_ms: Math.round(performance.now() - readyAt) });

		// Fade text/particles out, iris open from the finger.
		boot.classList.add('fade-text');
		bootText.style.opacity = '0';
		bootText.style.transform = 'scale(1.15)';
		document.getElementById('boot-sub').style.opacity = '0';

		const maxR = Math.hypot(
			Math.max(x, window.innerWidth - x),
			Math.max(y, window.innerHeight - y)
		) + 4;

		let start = 0;

		function ease(t) { return 1 - Math.pow(1 - t, 3); }

		function reveal(now) {
			if (!start) { start = now; }
			const t = Math.min((now - start) / DURATION, 1);
			const r = ease(t) * maxR;
			const grad = 'radial-gradient(circle at ' + x + 'px ' + y + 'px, transparent ' + r + 'px, black ' + (r + 2) + 'px)';
			boot.style.webkitMaskImage = grad;
			boot.style.maskImage = grad;
			if (t < 1) {
				window.requestAnimationFrame(reveal);
			} else {
				finishReveal();
			}
		}
		window.requestAnimationFrame(reveal);
	}

	function finishReveal() {
		phase = 'done';
		if (swarm) { swarm.stop(); }
		if (boot && boot.parentNode) { boot.parentNode.removeChild(boot); }
	}

	// =====================================================================
	// Failure path
	// =====================================================================
	function showNotice(text) {
		bootText.style.display = 'none';
		document.getElementById('boot-sub').style.display = 'none';
		while (bootNotice.lastChild) { bootNotice.removeChild(bootNotice.lastChild); }
		String(text).split('\n').forEach(function (line) {
			bootNotice.appendChild(document.createTextNode(line));
			bootNotice.appendChild(document.createElement('br'));
		});
		bootNotice.style.display = 'block';
	}

	function displayFailureNotice(err) {
		console.error(err);
		window.__analytics.track('boot_error', { msg: String((err && err.message) || err).slice(0, 200), fatal: true });
		if (err instanceof Error) {
			showNotice(err.message);
		} else if (typeof err === 'string') {
			showNotice(err);
		} else {
			showNotice('An unknown error occurred.');
		}
	}

	// =====================================================================
	// Engine boot
	// =====================================================================
	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {

			} catch (err) {

			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					loadProgress = Math.max(loadProgress, current / total);
				}
			},
		}).then(() => {
			loadProgress = 1;
			enterReady();
		}, displayFailureNotice);
	}
